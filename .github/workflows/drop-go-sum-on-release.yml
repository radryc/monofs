name: Drop go.sum on release

# Runs only when GitHub creates a release.
#
# Disable it either by:
#   * setting the repository variable DROP_GO_SUM_ON_RELEASE=false, or
#   * committing a .KEEP file (repo root keeps all, module-local keeps that one).
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      enabled:
        description: "Drop go.sum now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drop-go-sum-${{ github.repository }}
  cancel-in-progress: false

jobs:
  drop-go-sum:
    # Draft releases do not count; the repo variable is the global kill switch.
    if: >-
      ${{ vars.DROP_GO_SUM_ON_RELEASE != 'false' &&
          (github.event_name == 'release' && !github.event.release.draft ||
           github.event_name == 'workflow_dispatch' && inputs.enabled) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release branch
        id: target
        shell: bash
        env:
          TARGET: ${{ github.event.release.target_commitish }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          branch="${TARGET}"
          if [ -z "${branch}" ] || [[ "${branch}" =~ ^[0-9a-f]{40}$ ]]; then
            branch="${DEFAULT}"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - uses: ./.github/actions/drop-go-sum
        with:
          enabled: "true"
          commit: "true"
          branch: ${{ steps.target.outputs.branch }}
          release_tag: ${{ github.event.release.tag_name }}
