name: CI — Proto

on:
  push:
    branches: [main]
    paths:
      - 'api/proto/**.proto'
  pull_request:
    branches: [main]
    paths:
      - 'api/proto/**.proto'

jobs:
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: install protoc
        run: |
          curl -sSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: regenerate proto
        run: make proto

      - name: check for drift
        run: |
          if ! git diff --exit-code api/proto/; then
            echo "::error::Generated proto files are out of date. Run 'make proto' and commit the result."
            git diff --stat api/proto/
            exit 1
          fi
