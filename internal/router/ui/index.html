<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%static/static/monofs.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonoFS</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("strata.theme") || localStorage.getItem("monofs.theme");
          if (!theme) theme = "system";
          var resolved = theme;
          if (theme === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "daylight"
              : "midnight";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.dataset.themePreference = theme;
        } catch (e) { /* localStorage unavailable */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
